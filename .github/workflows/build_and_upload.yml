name: Build and Upload

on:
  workflow_call:
    inputs:
      isRelease:
        required: true
        type: boolean
      shouldUpload:
        required: true
        type: boolean

env:
  CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
  CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
  SIGNING_KEY: ${{ secrets.PGP_SECRET }}
  SIGNING_PASSWORD: ${{ secrets.PGP_PASSPHRASE }}

jobs:
  build_windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: 25

      - name: Set up Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Append the directory of 'vcvarsall.bat' to PATH environment variable
        uses: myci-actions/export-env-var-powershell@1
        with:
          name: PATH
          value: $env:PATH;C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build

      - name: Build runtime JNI project
        run: ./gradlew runtime_helper_build_project_windows64_jni

      - name: Build runtime FFM project
        run: ./gradlew runtime_helper_build_project_windows64_ffm

      - name: Build runtime TeaVM C project
        run: ./gradlew runtime_helper_build_project_windows64_teavm_c

      - name: Build TestLib JNI project
        run: ./gradlew TestLib_build_project_windows64_jni

      - name: Build TestLib FFM project
        run: ./gradlew TestLib_build_project_windows64_ffm

      - name: Run TestLib desktop JNI tests
        run: ./gradlew :examples:TestLib:lib:shared:TestLib-jni:assemble :examples:TestLib:app:platforms:desktop-jni:test --no-daemon --info --console=plain

      - name: Run TestLib desktop FFM tests
        run: ./gradlew :examples:TestLib:lib:desktop:TestLib-desktop-ffm:assemble :examples:TestLib:app:platforms:desktop-ffm:test --no-daemon --info --console=plain

      - name: Build Shared LibA JNI project
        run: ./gradlew LibA_build_project_windows64_jni

      - name: Build Shared LibA FFM project
        run: ./gradlew LibA_build_project_windows64_ffm

      - name: Build Shared LibB JNI project
        run: ./gradlew LibB_build_project_windows64_jni

      - name: Build Shared LibB FFM project
        run: ./gradlew LibB_build_project_windows64_ffm

      - name: Upload natives
        uses: actions/upload-artifact@v7
        with:
          name: windows-natives
          path: ./jParser/runtime/builder/build/c++/libs/

  build_linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: 25

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build runtime JNI project
        run: ./gradlew runtime_helper_build_project_linux64_jni

      - name: Build runtime FFM project
        run: ./gradlew runtime_helper_build_project_linux64_ffm

      - name: Build runtime TeaVM C project
        run: ./gradlew runtime_helper_build_project_linux64_teavm_c

      - name: Build TestLib JNI project
        run: ./gradlew TestLib_build_project_linux64_jni

      - name: Build TestLib FFM project
        run: ./gradlew TestLib_build_project_linux64_ffm

      - name: Run TestLib desktop JNI tests
        run: ./gradlew :examples:TestLib:lib:shared:TestLib-jni:assemble :examples:TestLib:app:platforms:desktop-jni:test --no-daemon --info --console=plain

      - name: Run TestLib desktop FFM tests
        run: ./gradlew :examples:TestLib:lib:desktop:TestLib-desktop-ffm:assemble :examples:TestLib:app:platforms:desktop-ffm:test --no-daemon --info --console=plain

      - name: Build Shared LibA JNI project
        run: ./gradlew LibA_build_project_linux64_jni

      - name: Build Shared LibA FFM project
        run: ./gradlew LibA_build_project_linux64_ffm

      - name: Build Shared LibB JNI project
        run: ./gradlew LibB_build_project_linux64_jni

      - name: Build Shared LibB FFM project
        run: ./gradlew LibB_build_project_linux64_ffm

      - name: Upload natives runtime
        uses: actions/upload-artifact@v7
        with:
          name: linux-natives
          path: ./jParser/runtime/builder/build/c++/libs/

  build_mac_intel:
    name: Build Mac Intel
    runs-on: macos-26-intel

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: 25

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build project JNI runtime
        run: ./gradlew runtime_helper_build_project_mac64_jni

      - name: Build runtime FFM project
        run: ./gradlew runtime_helper_build_project_mac64_ffm

      - name: Build runtime TeaVM C project
        run: ./gradlew runtime_helper_build_project_mac64_teavm_c

      - name: Build TestLib JNI project
        run: |
          ./gradlew TestLib_build_project_mac64_jni

      - name: Build TestLib FFM project
        run: |
          ./gradlew TestLib_build_project_mac64_ffm

      - name: Run TestLib desktop JNI tests
        run: |
          ./gradlew :examples:TestLib:lib:shared:TestLib-jni:assemble :examples:TestLib:app:platforms:desktop-jni:test --no-daemon --info --console=plain

      - name: Run TestLib desktop FFM tests
        run: |
          ./gradlew :examples:TestLib:lib:desktop:TestLib-desktop-ffm:assemble :examples:TestLib:app:platforms:desktop-ffm:test --no-daemon --info --console=plain

      - name: Build Shared LibA JNI project
        run: |
          ./gradlew LibA_build_project_mac64_jni

      - name: Build Shared LibA FFM project
        run: |
          ./gradlew LibA_build_project_mac64_ffm

      - name: Build Shared LibB JNI project
        run: |
          ./gradlew LibB_build_project_mac64_jni

      - name: Build Shared LibB FFM project
        run: |
          ./gradlew LibB_build_project_mac64_ffm

      - name: Upload natives runtime
        uses: actions/upload-artifact@v7
        with:
          name: mac-natives-intel
          path: ./jParser/runtime/builder/build/c++/libs/

  build_mac_arm:
    name: Build Mac Arm
    runs-on: macos-latest

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: 25

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build project JNI runtime
        run: ./gradlew runtime_helper_build_project_macArm_jni

      - name: Build runtime FFM project
        run: ./gradlew runtime_helper_build_project_macArm_ffm

      - name: Build runtime TeaVM C project
        run: ./gradlew runtime_helper_build_project_macArm_teavm_c

      - name: Build TestLib JNI project
        run: |
          ./gradlew TestLib_build_project_macArm_jni

      - name: Build TestLib FFM project
        run: |
          ./gradlew TestLib_build_project_macArm_ffm

      - name: Run TestLib desktop JNI tests
        run: |
          ./gradlew :examples:TestLib:lib:shared:TestLib-jni:assemble :examples:TestLib:app:platforms:desktop-jni:test --no-daemon --info --console=plain

      - name: Run TestLib desktop FFM tests
        run: |
          ./gradlew :examples:TestLib:lib:desktop:TestLib-desktop-ffm:assemble :examples:TestLib:app:platforms:desktop-ffm:test --no-daemon --info --console=plain

      - name: Build Shared LibA JNI project
        run: |
          ./gradlew LibA_build_project_macArm_jni

      - name: Build Shared LibA FFM project
        run: |
          ./gradlew LibA_build_project_macArm_ffm

      - name: Build Shared LibB JNI project
        run: |
          ./gradlew LibB_build_project_macArm_jni

      - name: Build Shared LibB FFM project
        run: |
          ./gradlew LibB_build_project_macArm_ffm

      - name: Upload natives runtime
        uses: actions/upload-artifact@v7
        with:
          name: mac-natives-arm
          path: ./jParser/runtime/builder/build/c++/libs/

  build_ios:
    name: Build and test iOS TeaVM C
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: 25

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build custom iOS emulator projects
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "arm64" ]; then
            simulator_arch=arm64
          else
            simulator_arch=x86_64
          fi
          ./gradlew \
            :examples:TestLib:app:platforms:ios-c:TestLib_build_app_ios_c \
            :examples:SharedLib:app:platforms:ios-c:SharedLib_build_app_ios_c \
            -PiosSimulatorArch="${simulator_arch}" \
            --no-daemon --console=plain

      - name: Verify packaged iOS archive slices
        shell: bash
        run: |
          set -euo pipefail
          for archive in \
            jParser/runtime/builder/build/c++/libs/ios/device/arm64/teavm_c/libruntime64_.a \
            jParser/runtime/builder/build/c++/libs/ios/simulator/arm64/teavm_c/libruntime64_.a \
            jParser/runtime/builder/build/c++/libs/ios/simulator/x86_64/teavm_c/libruntime64_.a; do
            test -f "${archive}"
            xcrun lipo -info "${archive}"
          done

      - name: Boot iOS simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          device_udid="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [d for values in data["devices"].values() for d in values if d.get("isAvailable") and "iPhone" in d.get("name", "")]
          if not devices:
              raise SystemExit("No available iPhone simulator")
          print(devices[0]["udid"])
          ')"
          echo "udid=${device_udid}" >> "${GITHUB_OUTPUT}"
          xcrun simctl boot "${device_udid}" 2>/dev/null || true
          xcrun simctl bootstatus "${device_udid}" -b

      - name: Run TestLib custom emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios-simulator-logs
          app_path="$(find examples/TestLib/app/platforms/ios-c/build/ios-c/cmake-simulator -type d -name TestLibIOSC.app -print -quit)"
          test -n "${app_path}"
          xcrun simctl install "${{ steps.simulator.outputs.udid }}" "${app_path}"
          log_path="build/ios-simulator-logs/testlib.log"
          runtime_log="build/ios-simulator-logs/testlib-runtime.log"
          system_log_path="build/ios-simulator-logs/testlib-system.log"
          crash_log_path="build/ios-simulator-logs/testlib-crash.log"
          screenshot_path="build/ios-simulator-logs/testlib.png"
          marker="TestLib iOS TeaVM C emulator passed"
          data_path="$(xcrun simctl get_app_container \
            "${{ steps.simulator.outputs.udid }}" \
            com.github.xpenatan.jparser.testlib.iosc data)"
          status_path="${data_path}/tmp/jparser-ios-status.txt"
          runtime_log_path="${data_path}/tmp/jparser-ios-runtime.log"
          rm -f "${status_path}" "${runtime_log_path}"
          xcrun simctl launch --terminate-running-process \
            "${{ steps.simulator.outputs.udid }}" \
            com.github.xpenatan.jparser.testlib.iosc
          passed=false
          for attempt in $(seq 1 120); do
            if [ -f "${status_path}" ] && grep -Fq "${marker}" "${status_path}"; then
              passed=true
              break
            fi
            sleep 1
          done
          if [ "${passed}" != "true" ]; then
            if [ -f "${status_path}" ]; then
              cp "${status_path}" "${log_path}"
            else
              echo "TestLib emulator created no status file" > "${log_path}"
            fi
            if [ -f "${runtime_log_path}" ]; then
              cp "${runtime_log_path}" "${runtime_log}"
            else
              echo "TestLib emulator created no runtime log" > "${runtime_log}"
            fi
            xcrun simctl io "${{ steps.simulator.outputs.udid }}" \
              screenshot "${screenshot_path}" || true
            xcrun simctl spawn "${{ steps.simulator.outputs.udid }}" \
              log show --last 5m --style compact \
              --predicate 'process == "TestLibIOSC" OR eventMessage CONTAINS[c] "TestLibIOSC"' \
              > "${system_log_path}" 2>&1 || true
            {
              for report_dir in \
                "${HOME}/Library/Logs/DiagnosticReports" \
                "${HOME}/Library/Developer/CoreSimulator/Devices/${{ steps.simulator.outputs.udid }}/data/Library/Logs/CrashReporter" \
                "${HOME}/Library/Developer/CoreSimulator/Devices/${{ steps.simulator.outputs.udid }}/data/Library/Logs/DiagnosticReports"; do
                if [ -d "${report_dir}" ]; then
                  find "${report_dir}" -type f \
                    \( -name 'TestLibIOSC*.ips' -o -name 'TestLibIOSC*.crash' \) \
                    -mmin -10 -print -exec cat {} \;
                fi
              done
            } > "${crash_log_path}" 2>&1 || true
            xcrun simctl terminate "${{ steps.simulator.outputs.udid }}" \
              com.github.xpenatan.jparser.testlib.iosc || true
            cat "${log_path}"
            cat "${runtime_log}"
            cat "${system_log_path}"
            cat "${crash_log_path}"
            echo "TestLib emulator did not report success"
            exit 1
          fi
          cp "${status_path}" "${log_path}"
          if [ -f "${runtime_log_path}" ]; then
            cp "${runtime_log_path}" "${runtime_log}"
          fi
          sleep 1
          xcrun simctl io "${{ steps.simulator.outputs.udid }}" screenshot "${screenshot_path}"
          xcrun simctl terminate "${{ steps.simulator.outputs.udid }}" \
            com.github.xpenatan.jparser.testlib.iosc
          grep -F "${marker}" "${log_path}"

      - name: Run SharedLib custom emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios-simulator-logs
          app_path="$(find examples/SharedLib/app/platforms/ios-c/build/ios-c/cmake-simulator -type d -name SharedLibIOSC.app -print -quit)"
          test -n "${app_path}"
          xcrun simctl install "${{ steps.simulator.outputs.udid }}" "${app_path}"
          log_path="build/ios-simulator-logs/sharedlib.log"
          runtime_log="build/ios-simulator-logs/sharedlib-runtime.log"
          system_log_path="build/ios-simulator-logs/sharedlib-system.log"
          crash_log_path="build/ios-simulator-logs/sharedlib-crash.log"
          screenshot_path="build/ios-simulator-logs/sharedlib.png"
          marker="SharedLib iOS TeaVM C emulator passed"
          data_path="$(xcrun simctl get_app_container \
            "${{ steps.simulator.outputs.udid }}" \
            com.github.xpenatan.jparser.sharedlib.iosc data)"
          status_path="${data_path}/tmp/jparser-ios-status.txt"
          runtime_log_path="${data_path}/tmp/jparser-ios-runtime.log"
          rm -f "${status_path}" "${runtime_log_path}"
          xcrun simctl launch --terminate-running-process \
            "${{ steps.simulator.outputs.udid }}" \
            com.github.xpenatan.jparser.sharedlib.iosc
          passed=false
          for attempt in $(seq 1 120); do
            if [ -f "${status_path}" ] && grep -Fq "${marker}" "${status_path}"; then
              passed=true
              break
            fi
            sleep 1
          done
          if [ "${passed}" != "true" ]; then
            if [ -f "${status_path}" ]; then
              cp "${status_path}" "${log_path}"
            else
              echo "SharedLib emulator created no status file" > "${log_path}"
            fi
            if [ -f "${runtime_log_path}" ]; then
              cp "${runtime_log_path}" "${runtime_log}"
            else
              echo "SharedLib emulator created no runtime log" > "${runtime_log}"
            fi
            xcrun simctl io "${{ steps.simulator.outputs.udid }}" \
              screenshot "${screenshot_path}" || true
            xcrun simctl spawn "${{ steps.simulator.outputs.udid }}" \
              log show --last 5m --style compact \
              --predicate 'process == "SharedLibIOSC" OR eventMessage CONTAINS[c] "SharedLibIOSC"' \
              > "${system_log_path}" 2>&1 || true
            {
              for report_dir in \
                "${HOME}/Library/Logs/DiagnosticReports" \
                "${HOME}/Library/Developer/CoreSimulator/Devices/${{ steps.simulator.outputs.udid }}/data/Library/Logs/CrashReporter" \
                "${HOME}/Library/Developer/CoreSimulator/Devices/${{ steps.simulator.outputs.udid }}/data/Library/Logs/DiagnosticReports"; do
                if [ -d "${report_dir}" ]; then
                  find "${report_dir}" -type f \
                    \( -name 'SharedLibIOSC*.ips' -o -name 'SharedLibIOSC*.crash' \) \
                    -mmin -10 -print -exec cat {} \;
                fi
              done
            } > "${crash_log_path}" 2>&1 || true
            xcrun simctl terminate "${{ steps.simulator.outputs.udid }}" \
              com.github.xpenatan.jparser.sharedlib.iosc || true
            cat "${log_path}"
            cat "${runtime_log}"
            cat "${system_log_path}"
            cat "${crash_log_path}"
            echo "SharedLib emulator did not report success"
            exit 1
          fi
          cp "${status_path}" "${log_path}"
          if [ -f "${runtime_log_path}" ]; then
            cp "${runtime_log_path}" "${runtime_log}"
          fi
          sleep 1
          xcrun simctl io "${{ steps.simulator.outputs.udid }}" screenshot "${screenshot_path}"
          xcrun simctl terminate "${{ steps.simulator.outputs.udid }}" \
            com.github.xpenatan.jparser.sharedlib.iosc
          grep -F "${marker}" "${log_path}"

      - name: Shut down iOS simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        run: xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" || true

      - name: Upload iOS simulator logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-logs
          path: ./build/ios-simulator-logs/
          if-no-files-found: ignore

      - name: Upload iOS runtime natives
        uses: actions/upload-artifact@v7
        with:
          name: ios-natives
          path: ./jParser/runtime/builder/build/c++/libs/ios/

  build_web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: 25

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: "6.0.3"

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build project runtime
        run: ./gradlew runtime_helper_build_project_web_wasm

      - name: Build project
        run: ./gradlew TestLib_build_project_web_wasm

      - name: Build Shared LibA project
        run: ./gradlew LibA_build_project_web_wasm

      - name: Build Shared LibB project
        run: ./gradlew LibB_build_project_web_wasm

      - name: Upload natives runtime
        uses: actions/upload-artifact@v7
        with:
          name: web-natives
          path: ./jParser/runtime/builder/build/c++/libs/

  build_android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: 25

      - name: Install NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Debug Android NDK setup
        run: |
          echo "setup-ndk output: ${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "ANDROID_NDK_HOME env: ${ANDROID_NDK_HOME}"
          if [ -d "${ANDROID_NDK_HOME}" ]; then
            echo "ANDROID_NDK_HOME exists"
            ls -la "${ANDROID_NDK_HOME}" | head -n 20
          else
            echo "ANDROID_NDK_HOME is missing"
          fi
          if [ -f "${ANDROID_NDK_HOME}/source.properties" ]; then
            echo "source.properties found"
            grep "^Pkg.Revision" "${ANDROID_NDK_HOME}/source.properties" || true
          else
            echo "source.properties not found"
          fi
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build project runtime
        run: ./gradlew runtime_helper_build_project_android_jni
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build runtime TeaVM C project
        run: ./gradlew runtime_helper_build_project_android_teavm_c
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build project
        run: ./gradlew TestLib_build_project_android_jni
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build Shared LibA project
        run: ./gradlew LibA_build_project_android_jni
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build Shared LibB project
        run: ./gradlew LibB_build_project_android_jni
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload natives
        uses: actions/upload-artifact@v7
        with:
          name: android-natives
          path: ./jParser/runtime/builder/build/c++/libs/

  upload_natives:
    name: Upload Natives
    needs: [build_windows, build_linux, build_mac_intel, build_mac_arm, build_ios, build_android, build_web]
    runs-on: ubuntu-latest

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get version
        id: version
        shell: bash
        run: |
          version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("gradle/libs.versions.toml").read_text(encoding="utf-8"))["versions"]["jParserRelease"])')"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: 25

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Delete generated Classes
        run: ./gradlew clean

      - name: Download windows natives runtime
        uses: actions/download-artifact@v8
        with:
          name: windows-natives
          path: ./jParser/runtime/builder/build/c++/libs/

      - name: Download linux natives runtime
        uses: actions/download-artifact@v8
        with:
          name: linux-natives
          path: ./jParser/runtime/builder/build/c++/libs/

      - name: Download mac intel natives runtime
        uses: actions/download-artifact@v8
        with:
          name: mac-natives-intel
          path: ./jParser/runtime/builder/build/c++/libs/

      - name: Download mac arm natives runtime
        uses: actions/download-artifact@v8
        with:
          name: mac-natives-arm
          path: ./jParser/runtime/builder/build/c++/libs/

      - name: Download android natives runtime
        uses: actions/download-artifact@v8
        with:
          name: android-natives
          path: ./jParser/runtime/builder/build/c++/libs/

      - name: Download iOS natives runtime
        uses: actions/download-artifact@v8
        with:
          name: ios-natives
          path: ./jParser/runtime/builder/build/c++/libs/ios/

      - name: Download web natives runtime
        uses: actions/download-artifact@v8
        with:
          name: web-natives
          path: ./jParser/runtime/builder/build/c++/libs/

      - name: Generate Java classes
        run: ./gradlew TestLib_build_project

      - name: Generate runtime project
        run: ./gradlew runtime_helper_build_project

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "bot@github.com"

      - name: Commit generated code
        if: ${{ inputs.shouldUpload }}
        run: |
          git add .
          git commit -m "Commit generated code" || echo "No changes to commit"
          git push origin HEAD

      - name: Prepare Release deploy files
        if: ${{ inputs.shouldUpload && inputs.isRelease }}
        run: ./gradlew prepareRelease

      - name: Upload Release deploy files artifact
        uses: actions/upload-artifact@v7
        if: ${{ inputs.shouldUpload && inputs.isRelease }}
        with:
          name: release-staging-deploy-${{ steps.version.outputs.value }}
          path: ./build/staging-deploy/

      - name: Upload Release to repository
        uses: nick-fields/retry@v4
        if: ${{ inputs.shouldUpload && inputs.isRelease }}
        with:
          max_attempts: 3
          timeout_minutes: 30
          retry_on: error
          command: ./gradlew publishRelease

      - name: Prepare Snapshot deploy files
        if: ${{ inputs.shouldUpload && !inputs.isRelease }}
        run: ./gradlew prepareSnapshot

      - name: Upload Snapshot deploy files artifact
        uses: actions/upload-artifact@v7
        if: ${{ inputs.shouldUpload && !inputs.isRelease }}
        with:
          name: snapshot-deploy-${{ steps.version.outputs.value }}-${{ github.run_number }}
          path: ./build/snapshot-deploy/

      - name: Upload Snapshot to repository
        uses: nick-fields/retry@v4
        if: ${{ inputs.shouldUpload && !inputs.isRelease }}
        with:
          max_attempts: 3
          timeout_minutes: 30
          retry_on: error
          command: ./gradlew publishSnapshot

      - name: Create Git tag
        uses: actions/github-script@v7
        if: ${{ inputs.isRelease }}
        with:
          script: |
            const versionOutputs = ${{ toJSON(steps.version.outputs) }};
            
            var version = versionOutputs.value;
            
            console.log("Version: " + version);
            
            var ref = "refs/tags/" + version
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: ref,
              sha: context.sha
            });
